services:
  # Ollama 服務
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=0
    restart: unless-stopped
    gpus: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: serve

  # ChromaDB 服務
  chromadb:
    image: ghcr.io/chroma-core/chroma:0.5.0
    container_name: chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - CHROMA_DB_DIR=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    command: uvicorn chromadb.app:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  # n8n 自動化服務（步驟4）
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-workflows:/home/node/.n8n/workflows
      - ./news-data:/app/news-data
    environment:
      - TZ=Asia/Taipei
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_USER_MANAGEMENT_DISABLED=true
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - N8N_TEMPLATES_ENABLED=false
      - N8N_ONBOARDING_FLOW_DISABLED=true
      - WEBHOOK_URL=http://n8n:5678
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
    restart: unless-stopped
    depends_on:
      - chromadb

  # OCR 服務
  ocr-service:
    build:
      context: ./mcp-server/ocr-service
      dockerfile: Dockerfile
    container_name: ocr-service
    ports:
      - "5000:5000"
    volumes:
      - ./mcp-server/ocr-service:/app
      - ./mcp-server/uploads:/app/uploads
    environment:
      - PYTHONUNBUFFERED=1
      - FLASK_ENV=production
    restart: unless-stopped

  # MCP 服務
  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: mcp-server
    ports:
      - "3001:3001"
    volumes:
      - ./mcp-server/uploads:/app/uploads
      - ./mcp-server/data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3001
      - MAX_FILE_SIZE=50mb
      - ALLOWED_FILE_TYPES=.pdf,.doc,.docx,.txt
      - OCR_SERVICE_URL=http://ocr-service:5000
    restart: unless-stopped
    depends_on:
      - ocr-service

  # 主應用服務
  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_EMBEDDING_MODEL=jeffh/intfloat-multilingual-e5-large-instruct:f16
      - CHROMA_URL=http://chromadb:8000
      - NEXT_PUBLIC_MCP_SERVER_URL=http://localhost:3001
    depends_on:
      - ollama
      - chromadb
      - mcp-server
    command: npm run dev
    networks:
      - default

volumes:
  ollama_data:
  chroma_data:
  n8n_data:
  mcp_uploads:
  mcp_data:

networks:
  default:
    driver: bridge

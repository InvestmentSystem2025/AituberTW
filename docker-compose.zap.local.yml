services:
  # Next.js App (ZAP scan target)
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Production runtime (use strict security headers for scanning)
      - NODE_ENV=production
      - SECURITY_HEADERS_MODE=strict
      # Ensure server-side Supabase client can reach Kong via Docker network
      - SUPABASE_INTERNAL_URL=http://supabase-kong:8000
      # Ensure browser-side Supabase client hits host-exposed Kong
      - NEXT_PUBLIC_SUPABASE_URL=http://localhost:8001
      - SUPABASE_AUTH_PUBLIC_URL=http://localhost:8001
      # Optional: if you don't need MCP during ZAP, keep it empty.
      - NEXT_PUBLIC_MCP_SERVER_URL=
    depends_on:
      supabase-kong:
        condition: service_started
      supabase-auth:
        condition: service_started
      supabase-rest:
        condition: service_started
      supabase-db:
        condition: service_healthy
    # Run a fresh build inside container, then wait for Kong+REST to respond, then start server.
    # Also generate a stable CSP nonce for strict scanning mode (SSG pages need a build-time nonce).
    command: >
      sh -lc "export CSP_NONCE=$(node -e \"process.stdout.write(require('crypto').randomBytes(16).toString('base64'))\")
      && npm run build
      && node -e \"const deadline=Date.now()+180000; const urls=['http://supabase-kong:8000/rest/v1/','http://supabase-kong:8000/auth/v1/health']; (async()=>{for(;;){try{const rs=await Promise.all(urls.map(u=>fetch(u).then(r=>r.status).catch(()=>0))); if(rs.every(s=>s>0 && s<500)) break;}catch{} if(Date.now()>deadline){console.error('Supabase not ready in time'); process.exit(1);} await new Promise(r=>setTimeout(r,2000));}})();\"
      && node_modules/.bin/next start -p 3000"

  # Supabase PostgreSQL
  supabase-db:
    image: supabase/postgres:15.6.1.101
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      TZ: Asia/Taipei
      APP_SEED_ADMIN_EMAIL: ${APP_SEED_ADMIN_EMAIL}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - listen_addresses=*
      - -c
      - search_path="$user", public, auth, storage, extensions
    volumes:
      - supabase_db_data:/var/lib/postgresql/data
      - ./supabase/init.sql:/docker-entrypoint-initdb.d/init-scripts/99_user_init.sql:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 40

  # Supabase Auth (GoTrue)
  supabase-auth:
    image: supabase/gotrue:v2.150.0
    depends_on:
      supabase-db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      GOTRUE_SITE_URL: ${AUTH_REDIRECT_URL:-http://localhost:3000}
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@supabase-db:5432/postgres?search_path=auth,public,storage,extensions
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED: "true"
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: ${SMTP_CONFIRMATION_PATH:-/auth/confirm}
      GOTRUE_MAILER_URLPATHS_INVITE: ${SMTP_INVITE_PATH:-/auth/confirm}
      GOTRUE_MAILER_DEFAULT_REDIRECT_URL: ${SMTP_DEFAULT_REDIRECT_URL:-http://localhost:3000}
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-0}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-AITuber Kit}
      GOTRUE_SMTP_MAX_FREQUENCY: ${SMTP_MAX_FREQUENCY:-1s}
      GOTRUE_EXTERNAL_URL: ${SITE_URL:-http://localhost:8001}
      GOTRUE_API_EXTERNAL_URL: ${SITE_URL:-http://localhost:8001}
      API_EXTERNAL_URL: ${SITE_URL:-http://localhost:8001}
      TZ: Asia/Taipei
    restart: unless-stopped

  # Supabase REST API (PostgREST)
  supabase-rest:
    image: postgrest/postgrest:v12.0.2
    depends_on:
      supabase-db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PGRST_DB_URI: postgres://postgres:${POSTGRES_PASSWORD}@supabase-db:5432/postgres
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_SCHEMAS: public,storage
      PGRST_JWT_SECRET: ${JWT_SECRET}
      TZ: Asia/Taipei
    restart: unless-stopped

  # Supabase Realtime
  supabase-realtime:
    image: supabase/realtime:v2.30.34
    depends_on:
      supabase-db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: supabase-db
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      PORT: 4000
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${REALTIME_SECRET_KEY_BASE:-dev-secret-key-base-change-me}
      APP_NAME: supabase-realtime
      REALTIME_CLUSTER_STRATEGY: none
      RELEASE_DISTRIBUTION: none
      RLIMIT_NOFILE: "100000"
      ELIXIR_ERL_OPTIONS: "-logger level error -kernel logger_level error"
      DB_MIGRATIONS_TABLE: realtime_schema_migrations
      TZ: Asia/Taipei
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    restart: unless-stopped

  # Supabase Storage
  supabase-storage:
    image: supabase/storage-api:v1.0.11
    depends_on:
      supabase-db:
        condition: service_started
      supabase-auth:
        condition: service_started
    env_file:
      - .env
    environment:
      ANON_KEY: ${SUPABASE_ANON_KEY}
      SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      POSTGREST_URL: http://supabase-rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@supabase-db:5432/postgres?search_path=auth,public,storage,extensions
      FILE_STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      STORAGE_S3_REGION: us-east-1
      STORAGE_S3_BUCKET: storage
      STORAGE_S3_ENDPOINT: http://localhost:9000
      STORAGE_S3_FORCE_PATH_STYLE: "true"
      STORAGE_S3_ACCESS_KEY_ID: minioadmin
      STORAGE_S3_SECRET_ACCESS_KEY: minioadmin
      TZ: Asia/Taipei
    restart: unless-stopped
    volumes:
      - supabase_storage_data:/var/lib/storage
    # Healthcheck removed: this image may not include curl, which can show as "unhealthy" even when OK.

  # Supabase Postgres Meta (pg-meta)
  supabase-meta:
    image: supabase/postgres-meta:v0.80.1
    depends_on:
      supabase-db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@supabase-db:5432/postgres?search_path=auth,public,storage,extensions
      PG_META_DB_HOST: supabase-db
      PG_META_DB_PORT: "5432"
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Taipei
    restart: unless-stopped

  # Kong API Gateway (host exposes 8001 -> container 8000)
  supabase-kong:
    image: kong:2.8.1
    depends_on: [supabase-auth, supabase-rest, supabase-realtime, supabase-storage]
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME,SRV
      KONG_LOG_LEVEL: notice
      KONG_PLUGINS: bundled,cors
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      # Hide Kong version info in response headers.
      # Kong defaults to: headers=server_tokens,latency_tokens
      # Remove server_tokens (Server/Via) while keeping latency headers.
      KONG_HEADERS: "latency_tokens"
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    ports:
      - "8001:8000"
    volumes:
      - ./supabase/kong.yml:/var/lib/kong/kong.yml:ro
    restart: unless-stopped

  # One-shot bootstrap: create default storage buckets (and seed app_admins if APP_SEED_ADMIN_EMAIL is set).
  # NOTE: This does NOT seed ToS. ToS seeding is handled by supabase-db init script mount (supabase/init.sql).
  supabase-bootstrap:
    image: alpine:3.20
    restart: "no"
    depends_on:
      supabase-storage:
        condition: service_started
      supabase-rest:
        condition: service_started
    env_file:
      - .env
    command: >
      sh -lc "set -e;
      apk add --no-cache curl >/dev/null;
      for i in $(seq 1 60); do curl -sf http://supabase-storage:5000/status && break || sleep 2; done;
      for i in $(seq 1 60); do curl -sf http://supabase-rest:3000/ && break || sleep 2; done;
      echo Seeding buckets...;
      curl -s -o /dev/null -w '%{http_code}\n' \
        -H 'Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}' \
        -H 'apikey: ${SUPABASE_SERVICE_ROLE_KEY}' \
        -H 'Content-Type: application/json' \
        -d '{\"name\":\"avatars\",\"public\":true}' \
        http://supabase-storage:5000/bucket || true;
      curl -s -o /dev/null -w '%{http_code}\n' \
        -H 'Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}' \
        -H 'apikey: ${SUPABASE_SERVICE_ROLE_KEY}' \
        -H 'Content-Type: application/json' \
        -d '{\"name\":\"private\",\"public\":false}' \
        http://supabase-storage:5000/bucket || true;
      if [ -n \"${APP_SEED_ADMIN_EMAIL}\" ]; then \
        echo Seeding app_admins...; \
        curl -s -o /dev/null -w '%{http_code}\n' \
          -H 'Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}' \
          -H 'apikey: ${SUPABASE_SERVICE_ROLE_KEY}' \
          -H 'Content-Type: application/json' \
          -H 'Prefer: resolution=merge-duplicates' \
          -d '[{\"email\":\"'\"${APP_SEED_ADMIN_EMAIL}\"'\"}]' \
          'http://supabase-rest:3000/app_admins?on_conflict=email' || true; \
      fi;
      echo Done."

volumes:
  supabase_db_data:
  supabase_storage_data:


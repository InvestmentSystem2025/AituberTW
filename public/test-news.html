<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新聞系統測試 - AITuber Kit</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2em;
        }
        
        .tabs {
            display: flex;
            border-bottom: 2px solid #eee;
            margin-bottom: 20px;
        }
        
        .tab {
            padding: 12px 24px;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 16px;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }
        
        .tab:hover {
            color: #333;
            background: #f5f5f5;
        }
        
        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
            font-weight: bold;
        }
        
        .tab-content {
            display: none;
            padding: 20px 0;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .control-group {
            margin-bottom: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border: 1px solid #dee2e6;
        }
        
        .control-group h3 {
            margin: 0 0 15px 0;
            color: #495057;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #495057;
        }
        
        select, input[type="number"] {
            width: 200px;
            padding: 8px 12px;
            border: 1px solid #ced4da;
            border-radius: 5px;
            font-size: 14px;
        }
        
        button {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            margin: 5px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .result {
            margin: 10px 0;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .result.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        
        .result.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        
        .result.info {
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
        }
        
        .news-item {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .news-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
            font-size: 16px;
        }
        
        .news-content {
            color: #666;
            line-height: 1.5;
            margin-bottom: 10px;
        }
        
        .news-meta {
            font-size: 12px;
            color: #888;
            border-top: 1px solid #eee;
            padding-top: 8px;
        }
        
        #results {
            max-height: 500px;
            overflow-y: auto;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📰 新聞系統測試</h1>
        
        <div class="tabs">
            <button class="tab active" onclick="showTab('fetch')">獲取新聞</button>
            <button class="tab" onclick="showTab('ingest')">新聞入庫</button>
            <button class="tab" onclick="showTab('search')">搜索測試</button>
            <button class="tab" onclick="showTab('chat')">新聞聊天</button>
        </div>

        <!-- 獲取新聞標籤 -->
        <div id="fetch" class="tab-content active">
            <div class="control-group">
                <h3>📡 獲取新聞數據</h3>
                <div class="form-group">
                    <label for="newsSource">新聞來源:</label>
                    <select id="newsSource">
                        <option value="all">全部</option>
                        <option value="taiwan">台灣</option>
                        <option value="japan">日本</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="newsLimit">數量限制:</label>
                    <input type="number" id="newsLimit" value="5" min="1" max="20">
                </div>
                <button onclick="fetchNews()">🚀 獲取新聞</button>
                <button onclick="clearResults('fetchResults')">🗑️ 清除結果</button>
            </div>
            <div id="fetchResults"></div>
        </div>

        <!-- 新聞入庫標籤 -->
        <div id="ingest" class="tab-content">
            <div class="control-group">
                <h3>💾 新聞數據入庫</h3>
                <div class="form-group">
                    <label for="ingestSource">新聞來源:</label>
                    <select id="ingestSource">
                        <option value="all">全部</option>
                        <option value="taiwan">台灣</option>
                        <option value="japan">日本</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="ingestLimit">數量限制:</label>
                    <input type="number" id="ingestLimit" value="3" min="1" max="10">
                </div>
                <button onclick="ingestNews()">📥 執行入庫</button>
                <button onclick="clearResults('ingestResults')">🗑️ 清除結果</button>
            </div>
            <div id="ingestResults"></div>
        </div>

        <!-- 搜索測試標籤 -->
        <div id="search" class="tab-content">
            <div class="control-group">
                <h3>🔍 新聞搜索測試</h3>
                <div class="form-group">
                    <label for="searchQuery">搜索關鍵詞:</label>
                    <input type="text" id="searchQuery" placeholder="例如：半導體、交通、AI" style="width: 300px;">
                </div>
                <button onclick="searchNews()">🔍 搜索新聞</button>
                <button onclick="clearResults('searchResults')">🗑️ 清除結果</button>
            </div>
            <div id="searchResults"></div>
        </div>

        <!-- 新聞聊天標籤 -->
        <div id="chat" class="tab-content">
            <div class="control-group">
                <h3>💬 新聞聊天測試</h3>
                <div class="form-group">
                    <label for="chatQuery">聊天問題:</label>
                    <input type="text" id="chatQuery" placeholder="例如：最近有什麼新聞？" style="width: 400px;">
                </div>
                <button onclick="chatWithNews()">💬 開始聊天</button>
                <button onclick="clearResults('chatResults')">🗑️ 清除結果</button>
            </div>
            <div id="chatResults"></div>
        </div>
    </div>

    <script>
        function showTab(tabName) {
            // 隱藏所有標籤內容
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // 顯示選中的標籤
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        function addResult(content, type = 'result', containerId = 'results') {
            const resultsDiv = document.getElementById(containerId);
            if (!resultsDiv) return;
            
            const resultDiv = document.createElement('div');
            resultDiv.className = `result ${type}`;
            resultDiv.innerHTML = content;
            resultsDiv.appendChild(resultDiv);
            resultsDiv.scrollTop = resultsDiv.scrollHeight;
        }

        function clearResults(containerId) {
            const resultsDiv = document.getElementById(containerId);
            if (resultsDiv) {
                resultsDiv.innerHTML = '';
            }
        }

        async function fetchNews() {
            const source = document.getElementById('newsSource').value;
            const limit = document.getElementById('newsLimit').value;
            
            addResult('🔄 正在獲取新聞...', 'info', 'fetchResults');
            
            try {
                const response = await fetch(`/api/news/fetch?source=${source}&limit=${limit}`);
                const data = await response.json();
                
                if (response.ok) {
                    addResult(`✅ 成功獲取 ${data.count} 條新聞 (來源: ${data.source})`, 'success', 'fetchResults');
                    
                    // 顯示新聞內容
                    data.newsItems.forEach((item, index) => {
                        const newsHtml = `
                            <div class="news-item">
                                <div class="news-title">${index + 1}. ${item.title}</div>
                                <div class="news-content">${item.content}</div>
                                <div class="news-meta">
                                    來源: ${item.source} | 語言: ${item.language} | 發布時間: ${new Date(item.publishedAt).toLocaleString()}
                                </div>
                            </div>
                        `;
                        addResult(newsHtml, 'info', 'fetchResults');
                    });
                } else {
                    addResult(`❌ 獲取新聞失敗: ${data.error}`, 'error', 'fetchResults');
                }
            } catch (error) {
                addResult(`❌ 網路錯誤: ${error.message}`, 'error', 'fetchResults');
            }
        }

        async function ingestNews() {
            const source = document.getElementById('ingestSource').value;
            const limit = document.getElementById('ingestLimit').value;
            
            addResult('🔄 正在執行新聞入庫...', 'info', 'ingestResults');
            
            try {
                // 1. 先獲取新聞
                addResult('📡 步驟 1: 獲取新聞數據...', 'info', 'ingestResults');
                const fetchResponse = await fetch(`/api/news/fetch?source=${source}&limit=${limit}`);
                const fetchData = await fetchResponse.json();
                
                if (!fetchResponse.ok) {
                    throw new Error(`獲取新聞失敗: ${fetchData.error}`);
                }
                
                addResult(`✅ 獲取到 ${fetchData.count} 條新聞`, 'success', 'ingestResults');
                
                // 2. 執行入庫
                addResult('💾 步驟 2: 存入向量資料庫...', 'info', 'ingestResults');
                const ingestResponse = await fetch('/api/news/ingest', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        newsItems: fetchData.newsItems,
                        collection: 'news_knowledge'
                    })
                });
                
                const ingestData = await ingestResponse.json();
                
                if (ingestResponse.ok) {
                    addResult(`✅ 成功入庫 ${ingestData.count} 條新聞到集合 '${ingestData.collection}'`, 'success', 'ingestResults');
                    addResult(`📁 已保存 JSON 備份: ${ingestData.savedFile}`, 'info', 'ingestResults');
                } else {
                    addResult(`❌ 入庫失敗: ${ingestData.error}`, 'error', 'ingestResults');
                }
                
            } catch (error) {
                addResult(`❌ 執行錯誤: ${error.message}`, 'error', 'ingestResults');
            }
        }

        async function searchNews() {
            const query = document.getElementById('searchQuery').value;
            if (!query.trim()) {
                addResult('❌ 請輸入搜索關鍵詞', 'error', 'searchResults');
                return;
            }
            
            addResult(`🔍 搜索關鍵詞: "${query}"`, 'info', 'searchResults');
            
            try {
                const response = await fetch('/api/rag/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        collection: 'news_knowledge',
                        query: query,
                        limit: 5
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    addResult(`✅ 找到 ${data.results.length} 條相關新聞`, 'success', 'searchResults');
                    
                    data.results.forEach((result, index) => {
                        const similarity = result.distance ? (1000 / (1 + result.distance)).toFixed(1) : 'N/A';
                        const resultHtml = `
                            <div class="news-item">
                                <div class="news-title">${index + 1}. 相關度: ${similarity}% (距離: ${(result.distance || 0).toFixed(1)})</div>
                                <div class="news-content">${result.content || result.document || '內容不可用'}</div>
                                <div class="news-meta">
                                    來源: ${result.metadata?.source || 'unknown'} | 
                                    類型: ${result.metadata?.type || 'unknown'} |
                                    標題: ${result.metadata?.title || 'N/A'}
                                </div>
                            </div>
                        `;
                        addResult(resultHtml, 'info', 'searchResults');
                    });
                } else {
                    addResult(`❌ 搜索失敗: ${data.error}`, 'error', 'searchResults');
                }
            } catch (error) {
                addResult(`❌ 網路錯誤: ${error.message}`, 'error', 'searchResults');
            }
        }

        async function chatWithNews() {
            const query = document.getElementById('chatQuery').value;
            if (!query.trim()) {
                addResult('❌ 請輸入聊天問題', 'error', 'chatResults');
                return;
            }
            
            addResult(`💬 問題: "${query}"`, 'info', 'chatResults');
            addResult('🤖 AI 正在思考...', 'info', 'chatResults');
            
            try {
                // 構建正確的 messages 格式
                const messages = [
                    {
                        role: 'user',
                        content: query
                    }
                ];

                const response = await fetch('/api/rag/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages: messages,
                        collection: 'news_knowledge',
                        ragEnabled: true,
                        searchLimit: 3,
                        model: 'gpt-oss:20b',
                        temperature: 0.7,
                        maxTokens: 4096
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    addResult(`✅ RAG 搜索: ${data.ragContext}`, 'success', 'chatResults');
                    addResult(`🤖 AI 回答:\n\n${data.message}`, 'info', 'chatResults');
                    addResult(`📊 使用模型: ${data.model} | 搜索結果: ${data.searchResults} 條`, 'info', 'chatResults');
                } else {
                    addResult(`❌ 聊天失敗: ${data.error}`, 'error', 'chatResults');
                }
            } catch (error) {
                addResult(`❌ 網路錯誤: ${error.message}`, 'error', 'chatResults');
            }
        }

        // 預設查詢建議
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('searchQuery').value = '半導體';
            document.getElementById('chatQuery').value = '最近有什麼新聞？';
        });
    </script>
</body>
</html>

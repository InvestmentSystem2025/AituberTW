version: '3.8'

services:
  mcp-server:
    build: .
    container_name: mcp-server
    ports:
      - "3001:3001"
    volumes:
      # 持久化上傳的檔案
      - ./uploads:/app/uploads
      # 持久化數據
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3001
      - MAX_FILE_SIZE=50mb
      - ALLOWED_FILE_TYPES=.pdf,.doc,.docx,.txt
    restart: unless-stopped
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge

